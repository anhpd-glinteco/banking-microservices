name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - account-service
          - transfer-service
          - transaction-history-service
          - notification-service
          - api-gateway
          - discovery-service
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Build and install common library
        run: mvn -B -ntp -f bank-common/pom.xml install
      - name: Verify service
        run: mvn -B -ntp -f "$MODULE/pom.xml" verify
      - name: Summarize test evidence
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for module in ('bank-common', os.environ['MODULE']):
                  reports = sorted(Path(module, 'target').glob('*reports/TEST-*.xml'))
                  if not reports:
                      print(f'::warning::{module}: no test reports; tests not demonstrated.')
                      summary.write(f'- {module}: no test reports. Build is not proof of TH4 integration.\n')
                      continue
                  totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
                  for report in reports:
                      root = ET.parse(report).getroot()
                      for key in totals:
                          totals[key] += int(root.get(key, 0))
                  summary.write(f'- {module}: {totals}\n')
                  if totals['tests'] == totals['skipped']:
                      print(f'::warning::{module}: no tests executed; tests not demonstrated.')

  mysql-integration:
    name: Account / MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      - name: Build and install common library
        run: mvn -B -ntp -f bank-common/pom.xml install
      - name: Verify MySQL transactions and profile queries
        run: mvn -B -ntp -f account-service/pom.xml -Pmysql-it verify
      - name: Require executed integration tests without failures or skips
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path('account-service/target/failsafe-reports').glob('TEST-*.xml'))
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Account MySQL integration: {totals}; reports={len(reports)}\n')
          if not reports or totals['tests'] <= 0 or any(totals[key] for key in ('failures', 'errors', 'skipped')):
              raise SystemExit('MySQL integration requires executed tests and zero failures/errors/skips.')
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-mysql-integration-reports
          path: account-service/target/failsafe-reports/
          if-no-files-found: error

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
