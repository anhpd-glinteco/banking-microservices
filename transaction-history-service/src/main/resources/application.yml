server:
  port: 8084

account:
  service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
    connect-timeout-ms: ${ACCOUNT_SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ACCOUNT_SERVICE_READ_TIMEOUT_MS:3000}

history:
  backfill:
    enabled: ${HISTORY_BACKFILL_ENABLED:false}

spring:
  application:
    name: transaction-history-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${HISTORY_DB_NAME:bank_history}
    username: ${HISTORY_DB_USER:history_app}
    password: ${HISTORY_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: history-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
