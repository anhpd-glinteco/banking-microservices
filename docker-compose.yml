version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - zookeeper
      - redis
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "29092:29092"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bank
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    # Keep the existing anonymous /var/lib/mysql volume; provision explicitly.

  discovery-service:
    build: ./discovery-service
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    depends_on:
      - discovery-service
      - mysql
      - kafka
      - redis
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - ACCOUNT_DB_NAME=${ACCOUNT_DB_NAME:-bank_account}
      - ACCOUNT_DB_USER=${ACCOUNT_DB_USER:-account_app}
      - ACCOUNT_DB_PASSWORD=${ACCOUNT_DB_PASSWORD:?Set ACCOUNT_DB_PASSWORD}
      - SPRING_REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/

  transfer-service:
    build:
      context: .
      dockerfile: transfer-service/Dockerfile
    depends_on:
      - discovery-service
      - mysql
      - kafka
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - TRANSFER_DB_NAME=${TRANSFER_DB_NAME:-bank_transfer}
      - TRANSFER_DB_USER=${TRANSFER_DB_USER:-transfer_app}
      - TRANSFER_DB_PASSWORD=${TRANSFER_DB_PASSWORD:?Set TRANSFER_DB_PASSWORD}
      - ACCOUNT_SERVICE_URL=http://account-service:8081
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    depends_on:
      - discovery-service
      - kafka
    environment:
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/

  transaction-history-service:
    build:
      context: .
      dockerfile: transaction-history-service/Dockerfile
    depends_on:
      - discovery-service
      - mysql
      - kafka
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - HISTORY_DB_NAME=${HISTORY_DB_NAME:-bank_history}
      - HISTORY_DB_USER=${HISTORY_DB_USER:-history_app}
      - HISTORY_DB_PASSWORD=${HISTORY_DB_PASSWORD:?Set HISTORY_DB_PASSWORD}
      - ACCOUNT_SERVICE_URL=http://account-service:8081
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/

  frontend:
    build: 
         context: ./frontend
         dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
       - VITE_API_URL=http://localhost:8080
