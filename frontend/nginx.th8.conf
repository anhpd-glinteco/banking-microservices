server {
    listen 5173;
    root /usr/share/nginx/html;

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway http://api-gateway:8080;
        # Gateway and the services see Docker hosts. Handle the browser's
        # same-origin request here, and preserve foreign origins for CORS.
        set $frontend_origin $scheme://$http_host;
        set $upstream_origin $http_origin;
        if ($http_origin = $frontend_origin) {
            set $upstream_origin "";
        }

        proxy_pass $gateway;
        proxy_set_header Origin $upstream_origin;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
